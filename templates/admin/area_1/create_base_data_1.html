{% extends 'admin/model/create.html' %}

<head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <title>Create Base Data</title>
</head>

{% block javascript %}
    <script>
        $(document).ready(function() {
            const lexicSelect = $('#lexic_id');
            const subcategorySelect = $('#subcategory_id');
            const itemSelect = $('#item_id');

            // Fetch Lexics
            $.get('/api/lexics', function(data) {
                data.forEach(lexic => {
                    lexicSelect.append(new Option(lexic.name, lexic.id));
                });
            });

            // Handle Lexic change
            lexicSelect.on('change', function() {
                const lexicId = $(this).val();

                // Clear subcategories and items
                subcategorySelect.empty().append(new Option("Select a Subcategory", ""));
                itemSelect.empty().append(new Option("Select an Item", ""));

                if (lexicId) {
                    // Fetch Subcategories
                    $.get(`/api/subcategories/${lexicId}`, function(data) {
                        data.forEach(subcategory => {
                            subcategorySelect.append(new Option(subcategory.name, subcategory.id));
                        });
                    });
                }
            });

            // Handle Subcategory change
            subcategorySelect.on('change', function() {
                const subcategoryId = $(this).val();

                // Clear items
                itemSelect.empty().append(new Option("Select an Item", ""));

                if (subcategoryId) {
                    // Fetch Items
                    $.get(`/api/items/${subcategoryId}`, function(data) {
                        data.forEach(item => {
                            itemSelect.append(new Option(item.name, item.id));
                        });
                    });
                }
            });

            // Handle click on fields with class .form-control.fc2
            $('.form-control.fc2').click(function() {
                $(this).select();
            });
        });
    </script>
{% endblock javascript %}

{% block body %}
  {{ super() }}
  <style>
    /* Add your custom CSS here */
    .form-horizontal .form-group {
        margin-bottom: 0;
    }

    .form-horizontal .control-label {
        float: left;
        width: 150px; /* Adjust the width as needed */
        text-align: right;
        margin-right: 10px; /* Adjust the margin as needed */
    }

    .form-horizontal .controls {
        overflow: hidden;
    }

    .form-horizontal .controls input,
    .form-horizontal .controls select,
    .form-horizontal .controls textarea {
        width: auto;
        float: left;
        margin-right: 10px; /* Adjust the margin as needed */
    }

    .form-control.fc2 {
      opacity: 0.5; /* Sets initial opacity to 50% */
      transition: opacity 0.5s ease-in-out; /* Smooth fade-in on focus */
    }
  </style>

  <div class="container mt-4">
      <form method="POST" action="{{ url_for('flussi_data_view.create_view') }}">
          <!-- Lexic Dropdown -->
          <div class="form-group">
              <label for="lexic_id">Tipo Pre-complaint</label>
              <select id="lexic_id" name="lexic_id" class="form-control" required>
                  <option value="">Select a Lexic</option>
              </select>
          </div>

          <!-- Subcategory Dropdown -->
          <div class="form-group">
              <label for="subcategory_id">Subcategory</label>
              <select id="subcategory_id" name="subcategory_id" class="form-control" required>
                  <option value="">Select a Subcategory</option>
              </select>
          </div>

          <!-- Item Dropdown -->
          <div class="form-group">
              <label for="item_id">Item</label>
              <select id="item_id" name="item_id" class="form-control" required>
                  <option value="">Select an Item</option>
              </select>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary">Submit</button>
      </form>
  </div>
{% endblock %}
