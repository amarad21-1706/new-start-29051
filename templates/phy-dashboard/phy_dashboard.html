{% extends "phy-dashboard/argon_base_phy.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Physical Contracts Dashboard</h2>
    <div class="row">
        <!-- Add Contract Data Button -->
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('phy.add_contract') }}" class="btn btn-warning btn-block">
                Add Contract Data
            </a>
        </div>

        <!-- Futures Prices Button -->
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('phy.futures_prices_view') }}" class="btn btn-success btn-block">
                Futures Prices
            </a>
        </div>

        <!-- Exchange Rates Button -->
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('phy.exchange_rates_view') }}" class="btn btn-primary btn-block">
                Exchange Rates
            </a>
        </div>

        <!-- Inflation Data Button -->
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('phy.inflation_data_view') }}" class="btn btn-info btn-block">
                Inflation Data
            </a>
        </div>
    </div>
    <div class="row">
        <!-- Historical Prices Button -->
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('phy.historical_prices_view') }}" class="btn btn-secondary btn-block">
                Historical Prices
            </a>
        </div>

        <!-- Benchmark Data Button -->
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('phy.benchmark_data_view') }}" class="btn btn-dark btn-block">
                Benchmark Data
            </a>
        </div>

        <!-- Comparative Analysis Button (Optional) -->
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('phy.comparative_analysis') }}" class="btn btn-info btn-block">
                Comparative Analysis
            </a>
        </div>

        <!-- Contract Filter/Search -->
        <!-- Contract Filter/Search -->
        <form action="{{ url_for('phy.search_contract') }}" method="get" class="form-inline">
            <div class="form-group mb-2">
                <label for="contract_id" class="text-white mr-2">Enter Contract ID</label>
                <input type="number" name="contract_id" id="contract_id" class="form-control" placeholder="Contract ID" required>
            </div>
            <button type="submit" class="btn btn-primary mb-2">View Comparison</button>
        </form>

    </div>
</div>
{% endblock %}
