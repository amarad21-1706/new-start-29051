{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-white">Inflation Data</h2>
    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th class="text-white">Date</th>
                <th class="text-white">Inflation Rate</th>
            </tr>
        </thead>
        <tbody>
            {% for data in inflation_data %}
            <tr>
                <td class="text-white">{{ data.date }}</td>
                <td class="text-white">{{ data.inflation_rate }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
